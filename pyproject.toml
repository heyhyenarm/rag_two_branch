[project]
name = "rag-two-branch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dr.Alien", email = "narmhye@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
]

[project.scripts]
rag-two-branch = "rag_two_branch:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
