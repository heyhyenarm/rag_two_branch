[project]
name = "rag-two-branch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dr.Alien", email = "narmhye@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.1",
    "langchain>=0.3,<1",
    "langchain-chroma>=0.2,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
]

[project.scripts]
rag-two-branch = "rag_two_branch:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "Ch3",
]
